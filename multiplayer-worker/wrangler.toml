name = "99-reflections-multiplayer"
main = "worker.mjs"
compatibility_date = "2026-04-07"

[vars]
ALLOWED_ORIGINS = "https://99namesofallah.org,https://www.99namesofallah.org,http://localhost:5000,http://127.0.0.1:5000"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "BattleRoom"

[[durable_objects.bindings]]
name = "RANKINGS"
class_name = "Leaderboard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BattleRoom", "Leaderboard"]
