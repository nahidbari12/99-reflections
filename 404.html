<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>

    <script>
      // Preserve the requested route when GitHub Pages serves this fallback.
      var route = window.location.pathname + window.location.search + window.location.hash;
      window.sessionStorage.setItem("spa-redirect", route);
      window.location.replace("/");
    </script>
  </head>
  <body>
    <p>Opening 99 Reflections…</p>
  </body>
</html>
